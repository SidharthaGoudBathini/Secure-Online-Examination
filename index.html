    // --- Toast Notification Helper ---
    function showToast(message, type = 'info', title = '') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const bg = type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' :
                 type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-900' :
                 type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-900' :
                 'bg-blue-50 border-blue-200 text-blue-900';

      const iconColor = type === 'success' ? 'text-emerald-600' :
                        type === 'error' ? 'text-rose-600' :
                        type === 'warning' ? 'text-amber-600' : 'text-blue-600';

      toast.className = `pointer-events-auto p-4 rounded-xl border shadow-lg transition-all flex items-start space-x-3 ${bg} fade-in`;
      toast.innerHTML = `
        <div class="flex-1 text-xs">
          ${title ? `<div class="font-bold text-sm mb-0.5 leading-snug">${title}</div>` : ''}
          <div class="opacity-90">${message}</div>
        </div>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // --- Role Switching & Login ---
    function loginRole(role) {
      if (role === 'STUDENT') {
        state.currentUser = { fullName: 'Alex Walker', email: 'student@secureexam.edu', role: 'STUDENT' };
        state.currentRole = 'STUDENT';
        navigatePage('student_dash');
        showToast('Signed in as Student: Alex Walker', 'success');
      } else if (role === 'FACULTY') {
        state.currentUser = { fullName: 'Dr. Robert Oppenheimer', email: 'faculty@secureexam.edu', role: 'FACULTY' };
        state.currentRole = 'FACULTY';
        navigatePage('faculty_dash');
        showToast('Signed in as Faculty: Dr. Robert Oppenheimer', 'success');
      } else if (role === 'ADMIN') {
        state.currentUser = { fullName: 'System Administrator', email: 'admin@secureexam.edu', role: 'ADMIN' };
        state.currentRole = 'ADMIN';
        navigatePage('admin_dash');
        showToast('Signed in as Administrator: System Admin', 'success');
      }
      updateNavbar();
    }

    function logoutUser() {
      state.currentUser = null;
      state.currentRole = null;
      navigatePage('landing');
      updateNavbar();
      showToast('Logged out of session', 'info');
    }

      const rLanding = document.getElementById('roleBtnLanding');

      else if (state.currentRole === 'FACULTY') rFaculty.className = 'px-2.5 py-1 rounded-lg font-semibold bg-white text-navy-900 shadow-xs';
      else if (state.currentRole === 'ADMIN') rAdmin.className = 'px-2.5 py-1 rounded-lg font-semibold bg-white text-navy-900 shadow-xs';

    // --- Page Router ---
    function navigatePage(pageName) {
      state.activePage = pageName;
      const container = document.getElementById('appContainer');
      const header = document.getElementById('mainHeader');

      // Hide header on distraction-minimized exam taking screen
      if (pageName === 'exam_taking') {
        header.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
      }

      updateNavbar();

      switch (pageName) {
        case 'landing':
          renderLandingPage(container);
          break;
        case 'student_dash':
          renderStudentDashboard(container);
          break;
        case 'exam_instructions':
          renderExamInstructions(container);
          break;
        case 'readiness':
          renderSystemReadiness(container);
          break;
        case 'exam_taking':
          renderExamTaking(container);
          break;
        case 'submission_confirm':
          renderSubmissionConfirmation(container);
          break;
        case 'results':
          renderResultsPage(container);
          break;
        case 'faculty_dash':
          renderFacultyDashboard(container);
          break;
        case 'faculty_monitor':
          renderLiveMonitoring(container);
          break;
        case 'faculty_qbank':
          renderQuestionBank(container);
          break;
        case 'admin_dash':
          renderAdminDashboard(container);
          break;
        case 'admin_users':
          renderAdminUsers(container);
          break;
        case 'admin_security':
          renderAdminSecurity(container);
          break;
        case 'admin_audit':
          renderAdminAuditLogs(container);
          break;
        default:
          renderLandingPage(container);
      }
      window.scrollTo(0, 0);
    }

    // ================= 5. EXAMINATION INTERFACE =================
    function startExaminationSession() {
      state.currentQIndex = 0;
      state.tabSwitchCount = 0;
      state.examTimerSeconds = state.currentExam.durationMinutes * 60;
      state.userAnswers = {};

      // Initialize answers map
      state.questions.forEach(q => {
        state.userAnswers[q.id] = { selectedOptionIds: [], textResponse: '', isMarkedForReview: false };
      });

      // Start Countdown Timer
      if (state.examTimerInterval) clearInterval(state.examTimerInterval);
      state.examTimerInterval = setInterval(() => {
        state.examTimerSeconds--;
        const timerEl = document.getElementById('examCountdownDisplay');
        if (timerEl) {
          const m = Math.floor(state.examTimerSeconds / 60).toString().padStart(2, '0');
          const s = (state.examTimerSeconds % 60).toString().padStart(2, '0');
          timerEl.innerText = `${m}:${s}`;
          if (state.examTimerSeconds < 60) {
            timerEl.className = 'font-mono font-bold text-rose-500 animate-pulse text-sm';
          }
        }
        if (state.examTimerSeconds <= 0) {
          clearInterval(state.examTimerInterval);
          showToast('Time expired! Auto-submitting responses...', 'warning');
          submitExamAction(true);
        }
      }, 1000);

      navigatePage('exam_taking');
    }

    function selectOption(optionId, isMulti) {
      const q = state.questions[state.currentQIndex];
      const ans = state.userAnswers[q.id];
      if (isMulti) {
        if (ans.selectedOptionIds.includes(optionId)) {
          ans.selectedOptionIds = ans.selectedOptionIds.filter(id => id !== optionId);
        } else {
          ans.selectedOptionIds.push(optionId);
        }
      } else {
        ans.selectedOptionIds = [optionId];
      }
      renderExamTaking(document.getElementById('appContainer'));
    }

    function handleShortAnswerInput(val) {
      const q = state.questions[state.currentQIndex];
      state.userAnswers[q.id].textResponse = val;
    }

    function toggleFlagQuestion() {
      const q = state.questions[state.currentQIndex];
      state.userAnswers[q.id].isMarkedForReview = !state.userAnswers[q.id].isMarkedForReview;
      renderExamTaking(document.getElementById('appContainer'));
    }

    function prevQuestion() {
      if (state.currentQIndex > 0) {
        state.currentQIndex--;
        renderExamTaking(document.getElementById('appContainer'));
      }
    }

    function nextQuestion() {
      if (state.currentQIndex < state.questions.length - 1) {
        state.currentQIndex++;
        renderExamTaking(document.getElementById('appContainer'));
      }
    }

    function gotoQuestion(idx) {
      state.currentQIndex = idx;
      renderExamTaking(document.getElementById('appContainer'));

      const modal = document.getElementById('proctorWarningModal');

    // ================= 6. SUBMISSION CONFIRMATION & EVALUATION =================
    function confirmSubmitModal() {
      if (confirm('Are you sure you want to finalize your examination? Once submitted, answers are graded on the server.')) {
        submitExamAction(false);
      }
    }

    function submitExamAction(isAuto) {
      if (state.examTimerInterval) clearInterval(state.examTimerInterval);

      // Server-side evaluation logic
      let score = 0;
      state.questions.forEach(q => {
        const userAns = state.userAnswers[q.id];
        let correct = false;

        if (q.type === 'MCQ') {
          const correctOpt = q.options.find(o => o.isCorrect);
          if (correctOpt && userAns.selectedOptionIds.length === 1 && userAns.selectedOptionIds[0] === correctOpt.id) {
            correct = true;
            score += q.marks;
          } else if (userAns.selectedOptionIds.length > 0 && state.currentExam.allowNegative) {
            score -= state.currentExam.negativeValue;
          }
        } else if (q.type === 'MULTI_SELECT') {
          const correctIds = q.options.filter(o => o.isCorrect).map(o => o.id);
          const userIds = userAns.selectedOptionIds;
          const match = correctIds.length === userIds.length && correctIds.every(id => userIds.includes(id));
          if (match) {
            correct = true;
            score += q.marks;
          }
        } else if (q.type === 'SHORT_ANSWER') {
          const text = (userAns.textResponse || '').trim().toLowerCase();
          if (text.includes('dijkstra')) {
            correct = true;
            score += q.marks;
          }
        }
      });

      score = Math.max(0, Math.round(score * 10) / 10);
      const percentage = Math.round((score / state.currentExam.totalMarks) * 100);
      const passed = score >= state.currentExam.passingMarks;

      state.lastEvaluatedResult = {
        totalScore: score,
        totalMarks: state.currentExam.totalMarks,
        percentage,
        passed,
        submittedAt: new Date().toLocaleTimeString(),
        tabSwitches: state.tabSwitchCount,
      };

      // Add to audit trail
      state.auditLogs.unshift({
        id: 'l' + Date.now(),
        action: 'EXAM_SUBMISSION',
        entity: 'ExamSession',
        user: 'Alex Walker (STUDENT)',
        details: `Submitted ${state.currentExam.title}. Score: ${score}/${state.currentExam.totalMarks} (${percentage}%)`,
        time: 'Just now'
      });

      navigatePage('submission_confirm');
    }

    function downloadResultsCsvMock() {
      const csv = "Student Name,Email,Exam,Score,Total Marks,Percentage,Result,Timestamp\\n" +
                  "Alex Walker,student@secureexam.edu,CS201 Midterm,40,50,80%,PASSED," + new Date().toISOString() + "\\n" +
                  "Jane Doe,jane.doe@secureexam.edu,CS201 Midterm,45,50,90%,PASSED," + new Date().toISOString() + "\\n";
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'examination_results_export.csv');
      a.click();
      showToast('Exported examination results CSV', 'success');
    }
