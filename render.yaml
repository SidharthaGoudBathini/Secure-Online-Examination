# Render Blueprint Specification for Secure Online Examination System
# Automatically provisions the managed PostgreSQL database and the fullstack Web Service

databases:
  - name: secure-exam-db
    databaseName: secure_exam_db
    user: secure_exam_user
    plan: free
    region: oregon

services:
  - type: web
    name: secure-online-examination
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: secure-exam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://secure-online-examination.onrender.com
